<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 170" role="img" aria-label="FIFO queue: Task 1 is first in line and runs first, then Task 2, Task 3 and Task 4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrQ" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#70f2be"/>
    </marker>
  </defs>

  <!-- GPU box -->
  <rect x="10" y="40" width="110" height="80" rx="10" fill="#131d33" stroke="#70f2be" stroke-width="2"/>
  <text x="65" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#eef2f9">GPU</text>
  <text x="65" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a6b5cd">runs one task</text>

  <line x1="190" y1="80" x2="126" y2="80" stroke="#70f2be" stroke-width="3" marker-end="url(#arrQ)"/>

  <!-- tasks -->
  <rect x="200" y="50" width="110" height="60" rx="8" fill="#0c1426" stroke="#ffb05b" stroke-width="2"/>
  <text x="255" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#eef2f9">Task 1</text>
  <text x="255" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffb05b">running</text>

  <rect x="320" y="50" width="100" height="60" rx="8" fill="#0c1426" stroke="#354869" stroke-width="2"/>
  <text x="370" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#eef2f9">Task 2</text>
  <text x="370" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a6b5cd">waiting</text>

  <rect x="430" y="50" width="100" height="60" rx="8" fill="#0c1426" stroke="#354869" stroke-width="2"/>
  <text x="480" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#eef2f9">Task 3</text>
  <text x="480" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a6b5cd">waiting</text>

  <rect x="540" y="50" width="100" height="60" rx="8" fill="#0c1426" stroke="#354869" stroke-width="2"/>
  <text x="590" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#eef2f9">Task 4</text>
  <text x="590" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a6b5cd">new</text>

  <text x="200" y="145" font-family="Arial, sans-serif" font-size="14" fill="#a6b5cd">first in, first out: the oldest task always goes next</text>
</svg>
