<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="Workflow: client pairs with host, sends a task, the Flask server queues it, the code runs, and the result returns to the client" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#45dce6"/>
    </marker>
    <marker id="arrDash" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a6b5cd"/>
    </marker>
  </defs>

  <!-- lanes -->
  <rect x="10" y="10" width="660" height="150" rx="12" fill="#131d33" stroke="#354869"/>
  <rect x="10" y="200" width="660" height="150" rx="12" fill="#131d33" stroke="#70f2be"/>
  <text x="26" y="35" font-family="Arial, sans-serif" font-size="14" fill="#a6b5cd">CLIENT LAPTOP (weaker)</text>
  <text x="26" y="225" font-family="Arial, sans-serif" font-size="14" fill="#70f2be">GPU HOST (stronger)</text>

  <!-- top row -->
  <rect x="30" y="60" width="180" height="70" rx="10" fill="#0c1426" stroke="#45dce6" stroke-width="2"/>
  <text x="120" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#eef2f9">Send task</text>
  <text x="120" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a6b5cd">HTTP request</text>

  <rect x="250" y="60" width="180" height="70" rx="10" fill="#0c1426" stroke="#a6b5cd" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="340" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#eef2f9">Pair securely</text>
  <text x="340" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a6b5cd">done once, first</text>

  <rect x="470" y="60" width="180" height="70" rx="10" fill="#0c1426" stroke="#45dce6" stroke-width="2"/>
  <text x="560" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#eef2f9">Get output</text>
  <text x="560" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a6b5cd">result comes back</text>

  <!-- bottom row -->
  <rect x="30" y="250" width="180" height="70" rx="10" fill="#0c1426" stroke="#70f2be" stroke-width="2"/>
  <text x="120" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#eef2f9">Flask server</text>
  <text x="120" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a6b5cd">receives the task</text>

  <rect x="250" y="250" width="180" height="70" rx="10" fill="#0c1426" stroke="#70f2be" stroke-width="2"/>
  <text x="340" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#eef2f9">Task queue</text>
  <text x="340" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a6b5cd">first in, first out</text>

  <rect x="470" y="250" width="180" height="70" rx="10" fill="#0c1426" stroke="#70f2be" stroke-width="2"/>
  <text x="560" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#eef2f9">Run and save</text>
  <text x="560" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a6b5cd">subprocess + result</text>

  <!-- arrows -->
  <line x1="250" y1="95" x2="214" y2="95" stroke="#a6b5cd" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrDash)"/>
  <line x1="120" y1="132" x2="120" y2="246" stroke="#45dce6" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="214" y1="285" x2="246" y2="285" stroke="#45dce6" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="434" y1="285" x2="466" y2="285" stroke="#45dce6" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="560" y1="248" x2="560" y2="134" stroke="#70f2be" stroke-width="3" marker-end="url(#arr)"/>
</svg>
