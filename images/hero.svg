<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-label="A weaker laptop sends tasks to a stronger GPU laptop and gets results back" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c1426"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c1426"/>
    </marker>
  </defs>

  <!-- light background so dark arrows and text show clearly -->
  <rect x="0" y="0" width="680" height="260" rx="16" fill="#eef2f9"/>

  <!-- left laptop (weaker) -->
  <rect x="40" y="50" width="180" height="120" rx="8" fill="#131d33" stroke="#354869" stroke-width="2"/>
  <rect x="20" y="170" width="220" height="12" rx="6" fill="#354869"/>
  <text x="130" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#a6b5cd">GPU load</text>
  <rect x="65" y="110" width="130" height="14" rx="7" fill="#0c1426"/>
  <rect x="65" y="110" width="130" height="14" rx="7" fill="#ffb05b"/>
  <text x="130" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffb05b">struggling</text>

  <!-- right laptop (host) -->
  <rect x="460" y="50" width="180" height="120" rx="8" fill="#131d33" stroke="#70f2be" stroke-width="2"/>
  <rect x="440" y="170" width="220" height="12" rx="6" fill="#354869"/>
  <text x="550" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#a6b5cd">GPU load</text>
  <rect x="485" y="110" width="130" height="14" rx="7" fill="#0c1426"/>
  <rect x="485" y="110" width="60" height="14" rx="7" fill="#70f2be"/>
  <text x="550" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#70f2be">has spare power</text>

  <!-- arrows between -->
  <line x1="255" y1="100" x2="425" y2="100" stroke="#0c1426" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/>
  <text x="340" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0c1426">task</text>
  <line x1="425" y1="140" x2="255" y2="140" stroke="#0c1426" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
  <text x="340" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0c1426">result</text>

  <!-- labels -->
  <rect x="40" y="194" width="180" height="58" rx="14" fill="#ffffff"/>
  <text x="130" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000000">Your laptop</text>
  <text x="130" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#000000">Integrated GPU</text>
  <rect x="460" y="194" width="180" height="58" rx="14" fill="#ffffff"/>
  <text x="550" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000000">GPU host</text>
  <text x="550" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#000000">Shares its GPU</text>
</svg>
